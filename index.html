<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#ecebe0;--card:#fff;--ink:#1f2418;--mute:#5f6552;--line:#d6d3c0;--acc:#4b5d2a;--acc-d:#2f3b1a;--accbg:#e1e8cf;--warn:#b3122b;--sand:#e8e4cf;--r:12px}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app-head{position:sticky;top:0;z-index:5;background:var(--acc-d);color:var(--sand);padding:calc(11px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 14px calc(14px + env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between}
.app-head::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(#c8102e 0 33.3%,#fff 33.3% 66.6%,#c8102e 66.6%)}
.app-head h1{font-size:17px;margin:0;letter-spacing:.14em;text-transform:uppercase}
.badge{font-size:12px;color:var(--sand);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:4px 10px}
.badge.warn{background:#c8102e;border-color:#c8102e;color:#fff}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px calc(92px + env(safe-area-inset-bottom))}
.view{display:none}.view.on{display:block}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--acc-d);display:flex;padding:0 env(safe-area-inset-right) max(env(safe-area-inset-bottom),10px) env(safe-area-inset-left)}
.tabbar button{flex:1;border:0;background:none;padding:8px 2px 7px;font-size:11px;color:#a9b08f;display:flex;flex-direction:column;align-items:center;gap:2px;letter-spacing:.02em}
.tabbar button span{font-size:20px;line-height:1}
.tabbar button.on{color:#fff;font-weight:600;box-shadow:inset 0 3px 0 #c8102e}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0 0 12px}
.seg{display:flex;background:#dedcc9;border-radius:10px;padding:3px;gap:3px;margin:0 0 10px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 6px;font-size:14px}
.seg button.on{background:#fff;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.15)}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:14px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.dng{color:var(--warn);border-color:#e8bcc4}
.btn.sm{padding:5px 9px;font-size:13px}
.mute{color:var(--mute)}.small{font-size:13px}
.plist button.p{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 7px;display:flex;align-items:center;gap:11px}
.av{min-width:48px;height:34px;padding:0 7px;border-radius:8px;background:var(--acc);color:#f2f4e4;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;letter-spacing:.02em}
.amt{font-variant-numeric:tabular-nums;font-weight:600}
.amt.neg{color:var(--warn)}
.today{font-size:12px;background:var(--accbg);color:var(--acc-d);border-radius:99px;padding:2px 8px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.sheetm{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.prodrow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:0 0 7px}
.prodrow .ic{font-size:24px;width:32px;text-align:center}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:22px;line-height:1}
.stp button.plus{background:var(--acc);border-color:var(--acc);color:#fff}
.stp b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.mtx{overflow-x:auto}
.mtx table{border-collapse:collapse;font-size:14px}
.mtx th,.mtx td{border:1px solid var(--line);padding:3px 4px;background:#fff;text-align:center}
.mtx td:first-child,.mtx th:first-child{position:sticky;left:0;text-align:left;background:#f3f1e6;white-space:nowrap;padding:3px 8px}
.mtx input{width:54px;padding:6px;text-align:center}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:6px 0 12px}
.pod>div{flex:1;max-width:140px;text-align:center}
.pod .blk{border-radius:10px 10px 0 0;margin-top:6px;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-size:26px}
.pod .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:#e4e2d2;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.kpis div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center}
.kpis b{display:block;font-size:17px}
.kpis span{font-size:12px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--acc-d);color:#fff;padding:9px 15px;border-radius:99px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.note{background:#f6efd0;border:1px solid #e3d48f;border-radius:10px;padding:9px 11px;font-size:13px;margin:0 0 10px}
.note.red{background:#fbe7ea;border-color:#e8a9b3}
.prevwrap{overflow-x:auto;padding-bottom:6px}
.sheet{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px;margin:0 0 16px;min-width:640px;color:#000}
.sheet .sh-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px}
.sheet h2{margin:0;font-size:18px}
table.st{width:100%;border-collapse:collapse;table-layout:fixed}
table.st th,table.st td{border:1px solid #222;padding:2px 5px;font-size:13px}
table.st th{background:#eee;text-align:center;vertical-align:middle}
table.st th small{display:block;font-weight:400;font-size:11px}
table.st td{height:10mm}
table.st .nm{width:46mm;text-align:left;font-weight:600}
table.st .pd{width:15mm}
.sheet .foot{font-size:11px;color:#555;margin:6px 0 0}
.hist{font-size:13px}
.hist div{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--acc);font-weight:700;margin:16px 2px 6px}
.edit{display:grid;grid-template-columns:34px 1fr 82px 92px 44px;gap:6px;align-items:center;margin:0 0 6px}
.edit.pe{grid-template-columns:100px 1fr 44px 44px}
.edit input,.edit select{padding:7px 8px}
.tg{width:44px;height:30px;border-radius:99px;border:1px solid var(--line);background:#dedcc9;position:relative}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.tg.on{background:var(--acc)}.tg.on::after{left:17px}
@media print{
  html,body{background:#fff}
  .app-head,.tabbar,.noprint,.toast,.overlay,.view:not(#v-print){display:none!important}
  .wrap{max-width:none;padding:0}
  #v-print{display:block!important}
  .prevwrap{overflow:visible}
  .sheet{border:0;border-radius:0;margin:0;padding:0;min-width:0;width:100%;break-after:page}
  .sheet:last-of-type{break-after:auto}
  table.st thead{display:table-header-group}
  table.st tr{break-inside:avoid}
}
</style>
</head>
<body>
<header class="app-head"><h1>Strichliste</h1><button class="badge" id="stor" data-act="tab" data-v="stamm">…</button></header>
<main class="wrap">
  <section class="view on" id="v-erf"></section>
  <section class="view" id="v-abr"></section>
  <section class="view" id="v-score"></section>
  <section class="view" id="v-print"></section>
  <section class="view" id="v-stamm"></section>
</main>
<nav class="tabbar">
  <button data-act="tab" data-v="erf" class="on"><span>✏️</span>Erfassen</button>
  <button data-act="tab" data-v="abr"><span>💶</span>Abrechnung</button>
  <button data-act="tab" data-v="score"><span>🏆</span>Scoreboard</button>
  <button data-act="tab" data-v="print"><span>🖨️</span>Druck</button>
  <button data-act="tab" data-v="stamm"><span>⚙️</span>Verwalten</button>
</nav>
<div class="overlay" id="ov"><div class="sheetm" id="sheetm"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
var KEY='strichliste.v3', VERSION='1.0.4';
var lsOk=true, idbOk=null, persisted=null;
var inFrame=false;try{inFrame=window.self!==window.top}catch(e){inFrame=true}
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var EUR=new Intl.NumberFormat('de-AT',{style:'currency',currency:'EUR'});
var money=function(c){return EUR.format(c/100)};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var pad=function(n){return String(n).padStart(2,'0')};
var dayKey=function(t){var d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var fmtD=function(d){return d.slice(8)+'.'+d.slice(5,7)+'.'};
var val=function(e){return e.q*e.price};
var S=null, ui={tab:'erf',mode:'single',q:'',sheet:null,per:'month',met:'eur',anon:false,exp:false};

/* ---------- Dienstgrade (aufsteigend; Abkürzungen bitte gegenprüfen) ---------- */
var RANKS=[['','ohne / zivil'],['Rekr','Rekrut'],['Gfr','Gefreiter'],['Kpl','Korporal'],['Zgsfhr','Zugsführer'],['Wm','Wachtmeister'],['OWm','Oberwachtmeister'],['StWm','Stabswachtmeister'],['OStWm','Oberstabswachtmeister'],['OStv','Offiziersstellvertreter'],['VzLt','Vizeleutnant'],['Fhr','Fähnrich'],['Lt','Leutnant'],['Olt','Oberleutnant'],['Hptm','Hauptmann'],['Mjr','Major'],['Obstlt','Oberstleutnant'],['Obst','Oberst'],['Brig','Brigadier'],['GenMjr','Generalmajor'],['GenLt','Generalleutnant'],['Gen','General']];
var rankIdx=function(r){for(var i=0;i<RANKS.length;i++)if(RANKS[i][0]===r)return i;return 0};
var lbl=function(p){return (p.rank?p.rank+' ':'')+p.last};
var rankOpts=function(sel){return RANKS.map(function(r){return '<option value="'+r[0]+'"'+(r[0]===sel?' selected':'')+'>'+(r[0]?r[0]+' – ':'')+r[1]+'</option>'}).join('')};

/* ---------- Persistenz: localStorage (sofort) + IndexedDB (Spiegel), neuerer Stand gewinnt ---------- */
function normalize(o){
  o.meta=o.meta||{savedAt:0,lastExport:0};o.payments=o.payments||[];
  o.settings=Object.assign({title:'',orient:'landscape',spare:3,sort:'name'},o.settings||{});
  o.people.forEach(function(p){if(p.last===undefined){p.last=p.name||'?'}delete p.name;p.rank=p.rank||''});
  return o;
}
function lsLoad(){try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&o.people&&o.products&&o.entries)return normalize(o)}}catch(e){lsOk=false}return null}
function idb(mode,fn){return new Promise(function(res,rej){
  try{var r=indexedDB.open('strichliste',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('kv')};
    r.onerror=function(){rej(r.error)};
    r.onsuccess=function(){var db=r.result,tx=db.transaction('kv',mode),q=fn(tx.objectStore('kv'));
      tx.oncomplete=function(){db.close();res(q&&q.result)};tx.onerror=tx.onabort=function(){db.close();rej(tx.error)}};
  }catch(e){rej(e)}})}
function save(){
  S.meta.savedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){lsOk=false}
  idb('readwrite',function(st){return st.put(JSON.parse(JSON.stringify(S)),'state3')}).then(function(){idbOk=true;badge()},function(){idbOk=false;badge()});
  badge();
}
function backupAge(){return S&&S.meta.lastExport?Math.floor((Date.now()-S.meta.lastExport)/864e5):null}
function badge(){
  var b=$('#stor');if(!b||!S)return;
  var ok=lsOk||idbOk,a=backupAge(),stale=a===null||a>7;
  b.textContent=!ok?'⚠ nur Sitzung':'Backup: '+(a===null?'nie':a===0?'heute':'vor '+a+' T');
  b.classList.toggle('warn',!ok||stale);
}
function askPersist(){try{if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().then(function(ok){persisted=ok;badge()},function(){})}}catch(e){}}

/* ---------- Demo-Daten ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function demo(){
  var r=mulberry(7);
  var pp=[['Obstlt','Pirker'],['Mjr','Wiegele'],['Hptm','Ortner'],['Olt','Kofler'],['Fhr','Brandstätter'],['Lt','Hafner'],['OStv','Zwischenberger'],['StWm','Egger'],['OWm','Rauter'],['Wm','Sablatnig'],['Zgsfhr','Oberlerchner'],['Kpl','Mayer'],['Gfr','Trattnig'],['Rekr','Lackner']];
  var prods=[['Kaffee',60,'A','☕',.62],['Twix',70,'A','🍫',.22],['Mineral',100,'B','💧',.25],['Cola',120,'B','🥤',.15],['Eistee',120,'B','🧃',.1],['Bier',150,'B','🍺',.06],['Energy',180,'B','⚡',.08],['Pizza',350,'B','🍕',.04]]
    .map(function(p){return {id:'pr_'+p[0].toLowerCase(),name:p[0],price:p[1],list:p[2],icon:p[3],active:true,w:p[4]}});
  var people=pp.map(function(n,i){return {id:'pe_'+i,rank:n[0],last:n[1],active:i!==pp.length-1}});
  var wt={};people.forEach(function(p){wt[p.id]={};prods.forEach(function(pr){wt[p.id][pr.id]=Math.min(.95,pr.w*(.2+r()*1.8))})});
  var entries=[],now=new Date();
  for(var i=95;i>=0;i--){
    var dt=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i,12);
    if(dt.getDay()===0||dt.getDay()===6)continue;
    people.forEach(function(p){
      if(r()>.78)return;
      prods.forEach(function(pr){
        if(r()<wt[p.id][pr.id]){var q=1+(r()<.25?1:0);entries.push({id:uid(),p:p.id,pr:pr.id,q:q,price:pr.price,d:dayKey(dt),t:dt.getTime()})}
      });
    });
  }
  var payments=[],c1=Date.now()-30*864e5,c2=Date.now()-10*864e5;
  people.forEach(function(p,i){
    if(i===2||i===7)return;
    var s1=0,s2=0;
    entries.forEach(function(e){if(e.p!==p.id)return;if(e.t<c1)s1+=val(e);else if(e.t<c2)s2+=val(e)});
    if(s1>0)payments.push({id:uid(),p:p.id,amt:s1,d:dayKey(c1),t:c1});
    if(i%3===0&&s2>0)payments.push({id:uid(),p:p.id,amt:s2,d:dayKey(c2),t:c2});
  });
  prods.forEach(function(p){delete p.w});
  return {people:people,products:prods,entries:entries,payments:payments,meta:{savedAt:0,lastExport:0},
    settings:{title:new Date().toLocaleDateString('de-AT',{month:'long',year:'numeric'}),orient:'landscape',spare:3,sort:'name'}};
}

/* ---------- Logik ---------- */
function cmpP(a,b){if(S.settings.sort==='rank'){var d=rankIdx(b.rank)-rankIdx(a.rank);if(d)return d}return a.last.localeCompare(b.last,'de')||rankIdx(b.rank)-rankIdx(a.rank)}
function activePeople(){return S.people.filter(function(p){return p.active}).sort(cmpP)}
function activeProds(){return S.products.filter(function(p){return p.active})}
function person(id){return S.people.find(function(p){return p.id===id})}
function prod(id){return S.products.find(function(p){return p.id===id})}
function openBal(pid){var s=0;S.entries.forEach(function(e){if(e.p===pid)s+=val(e)});S.payments.forEach(function(p){if(p.p===pid)s-=p.amt});return s}
function todayQty(pid,prid){var d=dayKey(Date.now()),q=0;S.entries.forEach(function(e){if(e.p===pid&&e.pr===prid&&e.d===d)q+=e.q});return q}
function inPer(e,per){if(per==='all')return true;var k=dayKey(Date.now());return e.d.indexOf(per==='month'?k.slice(0,7):k.slice(0,4))===0}
function ranking(per,met){
  var m={};S.entries.forEach(function(e){if(!inPer(e,per))return;m[e.p]=(m[e.p]||0)+(met==='eur'?val(e):e.q)});
  return Object.keys(m).map(function(k){return {p:k,v:m[k]}}).sort(function(a,b){return b.v-a.v});
}
function book(pid,prid,q,d){
  var pr=prod(prid);if(!pr||!q)return;
  var e=S.entries.find(function(x){return x.p===pid&&x.pr===prid&&x.d===d});
  if(e){e.q+=q;if(e.q<=0)S.entries.splice(S.entries.indexOf(e),1)}
  else if(q>0)S.entries.push({id:uid(),p:pid,pr:prid,q:q,price:pr.price,d:d,t:new Date(d+'T12:00:00').getTime()});
}
var armed={k:'',t:0};
function twice(k,msg){if(armed.k===k&&Date.now()-armed.t<3500){armed={k:'',t:0};return true}armed={k:k,t:Date.now()};toast(msg||'Nochmal tippen zum Bestätigen');return false}
var tt;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2600)}

/* ---------- Views ---------- */
function seg(act,key,items){return '<div class="seg">'+items.map(function(i){return '<button data-act="'+act+'" data-k="'+i[0]+'" class="'+(ui[key]===i[0]?'on':'')+'">'+i[1]+'</button>'}).join('')+'</div>'}
function av(p){return '<span class="av">'+esc(p.rank||'·')+'</span>'}
function backupNote(){
  var a=backupAge();
  if(!S.entries.length||(a!==null&&a<=7))return '';
  return '<div class="note red">💾 Letztes Backup: <b>'+(a===null?'nie':'vor '+a+' Tagen')+'</b>. <button class="btn sm" data-act="backup">Jetzt sichern</button></div>';
}

function renderErf(){
  if(!S.people.length){
    $('#v-erf').innerHTML='<div class="card"><h2>Willkommen</h2><p class="small" style="margin:0 0 10px">Noch keine Personen angelegt. Ablauf: Produkte und Preise anlegen, Personen eintragen, dann erfassen. Alle Daten bleiben auf diesem Gerät.</p><div class="chips"><button class="btn pri" data-act="tab" data-v="stamm">Personen &amp; Produkte anlegen</button><button class="btn" data-act="seedProducts">Beispielprodukte anlegen</button><button class="btn" data-act="loadDemo">Demo-Daten laden</button><button class="btn" data-act="pickFile">Backup-Datei laden</button></div><input type="file" id="fileIn" accept=".json,application/json,text/plain" hidden><p class="small mute" style="margin:10px 0 0">Beispielprodukte haben Platzhalterpreise – unter Verwalten anpassen. Demo-Daten kannst du jederzeit mit „Alles leeren“ löschen.</p></div>';
    return;
  }
  var h=backupNote()+seg('mode','mode',[['single','Einzeln'],['matrix','Matrix (Papierliste nachtragen)']]);
  if(ui.mode==='single'){
    h+='<input type="text" id="q" placeholder="Name oder Dienstgrad suchen…" value="'+esc(ui.q)+'"><div style="height:10px"></div><div class="plist" id="plist"></div>';
    $('#v-erf').innerHTML=h;renderPlist();
  }else{
    var ps=activePeople(),pr=activeProds();
    h+='<div class="card"><div class="row"><div class="grow"><b>Datum der Buchung</b><div class="small mute">Anzahl Striche je Person und Produkt eintragen, dann buchen.</div></div><div style="width:150px"><input type="date" id="mDate" value="'+dayKey(Date.now())+'"></div></div></div>';

function backupNow(){

/* ---------- PDF ohne Bibliothek (für iPhone: Teilen → Drucken) ---------- */
var WIN={'€':128,'–':150,'„':132,'“':147,'”':148,'’':146,'…':133};
function pdfStr(t){var o='';for(var i=0;i<t.length;i++){var c=t[i],n=t.charCodeAt(i);if(WIN[c]!==undefined)n=WIN[c];else if(n>255)n=63;if(n===40||n===41||n===92)o+='\\';o+=String.fromCharCode(n)}return '('+o+')'}
var _cv=null;
function tw(t,sz,b){try{_cv=_cv||document.createElement('canvas').getContext('2d');_cv.font=(b?'bold ':'')+sz+'px Helvetica, Arial, sans-serif';return _cv.measureText(t).width}catch(e){return t.length*sz*.52}}
function fit(t,w,sz,b){if(tw(t,sz,b)<=w)return t;while(t.length>1&&tw(t+'...',sz,b)>w)t=t.slice(0,-1);return t+'...'}
function buildPdf(){
  var land=S.settings.orient==='landscape',W=land?841.89:595.28,H=land?595.28:841.89,M=28;
  var rows=activePeople().map(lbl),sp=Math.max(0,parseInt(S.settings.spare,10)||0);for(var i=0;i<sp;i++)rows.push('');
  var prods=activeProds();
  var lists=[['Kaffee & Twix',prods.filter(function(p){return p.list==='A'}),1],['Getränke & Sonstiges',prods.filter(function(p){return p.list==='B'}),2]].filter(function(l){return l[1].length});
  var NAMEW=Math.min(150,W*.26),PAYW=44,HEADH=34,ROWH=28.3,YTOP=H-M-26,pages=[];
  var f2=function(n){return n.toFixed(2)};
  var txt=function(x,y,t,sz,b){return 'BT /F'+(b?2:1)+' '+sz+' Tf '+f2(x)+' '+f2(y)+' Td '+pdfStr(t)+' Tj ET\n'};
  var ctr=function(x,w,y,t,sz,b){return txt(x+(w-tw(t,sz,b))/2,y,t,sz,b)};
  var box=function(x,y,w,h,fill){return fill?'0.92 g '+f2(x)+' '+f2(y)+' '+f2(w)+' '+f2(h)+' re f 0 g\n':f2(x)+' '+f2(y)+' '+f2(w)+' '+f2(h)+' re S\n'};
  var date=new Date().toLocaleDateString('de-AT');
  lists.forEach(function(L){
    var ps=L[1],colW=(W-2*M-NAMEW-PAYW)/ps.length,idx=0,first=true;
    while(first||idx<rows.length){
      var c='0.6 w 0 G\n',y=YTOP;
      c+=txt(M,H-M-12,'Liste '+L[2]+' · '+L[0]+(first?'':' (Forts.)'),14,true);
      var ttl=fit(S.settings.title||'',W/2,10,false);c+=txt(W-M-tw(ttl,10,false),H-M-12,ttl,10,false);
      first=false;
      c+=box(M,y-HEADH,W-2*M,HEADH,true);
      c+=box(M,y-HEADH,NAMEW,HEADH)+txt(M+4,y-HEADH/2-3,'Dienstgrad Name',9,true);
      ps.forEach(function(p,k){var x=M+NAMEW+k*colW;c+=box(x,y-HEADH,colW,HEADH)+ctr(x,colW,y-14,fit(p.name,colW-6,9,true),9,true)+ctr(x,colW,y-26,money(p.price),7.5,false)});
      var px=M+NAMEW+ps.length*colW;c+=box(px,y-HEADH,PAYW,HEADH)+ctr(px,PAYW,y-HEADH/2-3,'bezahlt',8,true);
      y-=HEADH;
      while(idx<rows.length&&y-ROWH>=M+14){
        c+=box(M,y-ROWH,NAMEW,ROWH)+(rows[idx]?txt(M+4,y-ROWH/2-3.5,fit(rows[idx],NAMEW-8,10,true),10,true):'');
        ps.forEach(function(p,k){c+=box(M+NAMEW+k*colW,y-ROWH,colW,ROWH)});
        c+=box(px,y-ROWH,PAYW,ROWH);y-=ROWH;idx++;
      }
      c+=txt(M,M-2,'Pro Konsum einen Strich. Gedruckt am '+date,8,false);
      pages.push(c);
    }
  });
  if(!pages.length)pages.push('BT /F1 12 Tf 40 '+f2(H-60)+' Td '+pdfStr('Keine aktiven Produkte oder Personen.')+' Tj ET\n');
  pages=pages.map(function(c,i){return c+txt(W-M-40,M-2,'Seite '+(i+1)+'/'+pages.length,8,false)});
  var obj=[null,'<< /Type /Catalog /Pages 2 0 R >>',null,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'];
  var kids=[];
  pages.forEach(function(c,i){var cid=5+2*i,pid=6+2*i;obj[cid]='<< /Length '+c.length+' >>\nstream\n'+c+'endstream';obj[pid]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+f2(W)+' '+f2(H)+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+cid+' 0 R >>';kids.push(pid+' 0 R')});
  obj[2]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+pages.length+' >>';
  var out='%PDF-1.4\n',off=[];
  for(var k=1;k<obj.length;k++){off[k]=out.length;out+=k+' 0 obj\n'+obj[k]+'\nendobj\n'}
  var xr=out.length;out+='xref\n0 '+obj.length+'\n0000000000 65535 f \n';
  for(k=1;k<obj.length;k++)out+=String(off[k]).padStart(10,'0')+' 00000 n \n';
  out+='trailer\n<< /Size '+obj.length+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
  var u=new Uint8Array(out.length);for(k=0;k<out.length;k++)u[k]=out.charCodeAt(k)&255;
  return u;
}
function pdfShare(){
  if(!S.people.length){toast('Keine Personen angelegt');return}
  if(inFrame){toast('Vorschau: PDF-Export gesperrt – App lokal öffnen');return}
  var name='strichliste-'+dayKey(Date.now())+'.pdf',bytes,f;
  try{bytes=buildPdf();f=new File([bytes],name,{type:'application/pdf'})}catch(e){toast('PDF-Fehler: '+(e&&e.message||e));return}
  function openIt(){
    try{
      var url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
      var w=window.open(url,'_blank');
      if(!w){var a=document.createElement('a');a.href=url;a.target='_blank';a.download=name;document.body.appendChild(a);a.click();a.remove()}
      toast('PDF geöffnet – dort Teilen → Drucken');
    }catch(e){toast('PDF konnte nicht geöffnet werden: '+(e&&e.name||e))}
  }
  var can=false;try{can=!!(navigator.canShare&&navigator.canShare({files:[f]}))}catch(e){}
  if(can){
    toast('PDF wird geteilt…');
    navigator.share({files:[f],title:name}).then(function(){toast('Fertig')},function(err){if(err&&err.name==='AbortError')return;toast('Teilen fehlgeschlagen ('+(err&&err.name||'?')+') – öffne PDF');openIt()});
  }else{toast('Teilen nicht verfügbar – öffne PDF');openIt()}
}

/* ---------- Events ---------- */
var A={
  tab:function(b){ui.tab=b.dataset.v;ui.sheet=null;render();try{window.scrollTo(0,0)}catch(e){}},
  mode:function(b){ui.mode=b.dataset.k;render()},
  per:function(b){ui.per=b.dataset.k;render()},
  met:function(b){ui.met=b.dataset.k;render()},
  anon:function(){ui.anon=!ui.anon;render()},
  openP:function(b){ui.sheet=b.dataset.id;renderSheet()},
  closeSheet:function(){ui.sheet=null;renderSheet();renderPlist()},
  inc:function(b){book(ui.sheet,b.dataset.pr,1,dayKey(Date.now()));save();renderSheet();renderPlist()},
  dec:function(b){book(ui.sheet,b.dataset.pr,-1,dayKey(Date.now()));save();renderSheet();renderPlist()},
  delEntry:function(b){S.entries=S.entries.filter(function(e){return e.id!==b.dataset.id});save();renderSheet();renderPlist()},
  mbook:function(){
    var d=$('#mDate').value||dayKey(Date.now()),n=0;
    document.querySelectorAll('#v-erf .mtx input').forEach(function(i){var q=parseInt(i.value,10);if(q>0){book(i.dataset.p,i.dataset.pr,q,d);n+=q;i.value=''}});
    save();toast(n?n+' Striche gebucht':'Nichts eingetragen');
  },
  pay:function(b){
    var p=person(b.dataset.id),bal=openBal(b.dataset.id);
    if(!twice('pay'+b.dataset.id,'Nochmal tippen: '+lbl(p)+' hat '+money(bal)+' bezahlt'))return;
    S.payments.push({id:uid(),p:p.id,amt:bal,d:dayKey(Date.now()),t:Date.now()});save();render();toast('Zahlung gebucht');
  },
  delPay:function(b){if(!twice('dp'+b.dataset.id))return;S.payments=S.payments.filter(function(p){return p.id!==b.dataset.id});save();render()},
  print:function(){try{window.print()}catch(e){}},
  pdf:pdfShare,
  togP:function(b){var p=person(b.dataset.id);p.active=!p.active;save();render()},
  togPr:function(b){var p=prod(b.dataset.id);p.active=!p.active;save();render()},
  delP:function(b){if(!twice('dl'+b.dataset.id))return;S.people=S.people.filter(function(p){return p.id!==b.dataset.id});save();render()},
  addP:function(){var v=$('#newLast').value.trim();if(!v){toast('Nachname eingeben');return}S.people.push({id:'pe_'+uid(),rank:$('#newRank').value,last:v,active:true});save();render()},
  addPr:function(){
    var n=$('#newPr').value.trim(),c=Math.round(parseFloat(($('#newPrice').value||'').replace(',','.'))*100);
    if(!n||!(c>=0)){toast('Name und Preis angeben');return}
    S.products.push({id:'pr_'+uid(),name:n,price:c,list:'B',icon:'🛒',active:true});save();render();
  },
  pickFile:function(){
    if((S.people.length||S.entries.length)&&!twice('pickfile','Ersetzt alle aktuellen Daten – nochmal tippen zum Fortfahren'))return;
    var f=$('#fileIn');if(f){f.value='';f.click()}
  },
  backup:backupNow,
  seedProducts:function(){
    [['Kaffee',50,'A','☕'],['Twix',70,'A','🍫'],['Mineral',100,'B','💧'],['Cola',120,'B','🥤'],['Bier',150,'B','🍺'],['Pizza',350,'B','🍕']].forEach(function(x){S.products.push({id:'pr_'+uid(),name:x[0],price:x[1],list:x[2],icon:x[3],active:true})});
    save();ui.tab='stamm';render();toast('Beispielprodukte angelegt – Preise anpassen');
  },
  loadDemo:function(){S=demo();save();render();toast('Demo-Daten geladen')},
  export:function(){ui.exp=true;ui.expFill=true;render()},
  import:function(){ui.exp=true;ui.expFill=false;render()},
  copyJson:function(){var v=$('#jsonbox').value;try{navigator.clipboard.writeText(v).then(function(){toast('Kopiert')},function(){toast('Kopieren blockiert – Text manuell markieren')})}catch(e){toast('Kopieren blockiert – Text manuell markieren')}},
  doImport:function(){
    try{var o=JSON.parse($('#jsonbox').value);if(!o.people||!o.products||!o.entries)throw 0;S=normalize(o);save();ui.exp=false;render();toast('Importiert')}
    catch(e){toast('Kein gültiges Backup')}
  },
  demo:function(){if(!twice('demo','Nochmal tippen: ersetzt alle Daten durch Demo-Daten'))return;S=demo();save();render()},
  wipe:function(){if(!twice('wipe','Nochmal tippen: löscht ALLE Daten'))return;S=normalize({people:[],products:[],entries:[],payments:[],settings:{}});save();render()}
};
document.addEventListener('click',function(e){
  if(e.target.id==='ov'){A.closeSheet();return}
  var b=e.target.closest('[data-act]');if(b&&A[b.dataset.act]&&!b.disabled){if(!persisted)askPersist();A[b.dataset.act](b)}
});
document.addEventListener('input',function(e){if(e.target.id==='q'){ui.q=e.target.value;renderPlist()}});
document.addEventListener('change',function(e){
  if(e.target.id==='fileIn'){
    var file=e.target.files&&e.target.files[0];if(!file)return;
    var rd=new FileReader();
    rd.onload=function(){try{var o=JSON.parse(rd.result);if(!o.people||!o.products||!o.entries)throw 0;S=normalize(o);save();ui.tab='erf';ui.exp=false;render();toast('Backup geladen: '+S.people.length+' Personen, '+S.entries.length+' Buchungen')}catch(err){toast('Datei ist kein gültiges Backup')}};
    rd.onerror=function(){toast('Datei nicht lesbar')};
    rd.readAsText(file);return;
  }
  var t=e.target,c=t.dataset.chg;if(!c)return;var v=t.value;
  if(c==='title')S.settings.title=v;
  else if(c==='spare')S.settings.spare=Math.max(0,Math.min(20,parseInt(v,10)||0));
  else if(c==='orient')S.settings.orient=v;
  else if(c==='sort')S.settings.sort=v;
  else if(c==='prank')person(t.dataset.id).rank=v;
  else if(c==='plast'){if(v.trim())person(t.dataset.id).last=v.trim()}
  else if(c==='prname'){if(v.trim())prod(t.dataset.id).name=v.trim()}
  else if(c==='picon')prod(t.dataset.id).icon=v.trim()||'🛒';
  else if(c==='price'){var n=Math.round(parseFloat(v.replace(',','.'))*100);if(n>=0)prod(t.dataset.id).price=n}
  else if(c==='plist')prod(t.dataset.id).list=v;
  save();render();
});
document.addEventListener('visibilitychange',function(){if(document.hidden&&S)save()});

/* ---------- Start ---------- */
try{localStorage.removeItem('strichliste.v1');localStorage.removeItem('strichliste.v2')}catch(e){}
S=lsLoad();
if(S){render()}
var started=false;
function emptyState(){return normalize({people:[],products:[],entries:[],payments:[],settings:{title:new Date().toLocaleDateString('de-AT',{month:'long',year:'numeric'})}})}
function fallback(){if(started)return;started=true;if(!S){S=emptyState();save()}render()}
idb('readonly',function(st){return st.get('state3')}).then(function(o){
  idbOk=true;
  if(o&&o.people&&o.products&&o.entries){
    o=normalize(o);
    if(!S||(o.meta.savedAt||0)>(S.meta.savedAt||0)){var restored=!S;S=o;started=true;render();if(restored)toast('Daten aus interner Sicherung wiederhergestellt');return}
  }
  fallback();
},function(){idbOk=false;fallback()});
setTimeout(fallback,4000);
askPersist();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!inFrame){
  navigator.serviceWorker.register('sw.js').then(function(reg){
    reg.addEventListener('updatefound',function(){var nw=reg.installing;if(nw)nw.addEventListener('statechange',function(){if(nw.state==='installed'&&navigator.serviceWorker.controller)toast('Update geladen – App einmal schließen und neu öffnen')})});
  }).catch(function(){});
}
window.__app={get S(){return S},A:A,ui:ui,render:render,lbl:lbl,buildPdf:buildPdf};
})();
