name: Windows-Build

on:
  workflow_dispatch:
  push:
    tags: ['win-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abhängigkeiten
        working-directory: desktop
        run: npm install
      - name: Portable .exe bauen
        working-directory: desktop
        run: npm run build
      - name: Als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: Strichliste-portable
          path: desktop/dist/Strichliste-portable.exe
      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/Strichliste-portable.exe
